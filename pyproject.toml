# Ruff: linting and formatting

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
extend-select = [
    "I",       # Import sorting
    "UP",      # Modern Python syntax
    "B",       # Bugbear: likely bugs and bad practices
    "SIM",     # Code simplification
    "ANN",     # Explicit type annotations
    "PYI",     # Typing-related rules
    "PGH003",  # Require specific codes for type: ignore
]
preview = true

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = false
suppress-none-returning = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


# ty: static type checking

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "warn"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true